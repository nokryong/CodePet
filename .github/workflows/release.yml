name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag and package version do not match" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --json isDraft --jq '.isDraft' > release-state.txt; then
            # A public version is immutable; later main commits do not republish it.
            if [[ "$(cat release-state.txt)" == false ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            test "$(cat release-state.txt)" = true
            target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
            test "$target" = "$GITHUB_SHA"
          else
            # Distinguish a new version from authentication or network errors.
            gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > release-tags.txt
            if grep -Fxq "$tag" release-tags.txt; then exit 1; fi
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            file: artifacts/*.exe
          - os: ubuntu-latest
            target: --linux
            file: artifacts/*.AppImage*
          - os: macos-latest
            target: --mac
            file: artifacts/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CODEPET_LINUX_SMOKE_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
      - name: Configure the packaged Electron sandbox helper
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo chown root:root artifacts/linux-unpacked/chrome-sandbox
          sudo chmod 4755 artifacts/linux-unpacked/chrome-sandbox
          test "$(stat -c '%U:%G %a' artifacts/linux-unpacked/chrome-sandbox)" = "root:root 4755"
      - name: Smoke-test the packaged Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          timeout 15s xvfb-run -a artifacts/linux-unpacked/code-pet
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
      - name: Remove the Linux smoke-test package
        if: always() && runner.os == 'Linux'
        run: node scripts/build-artifacts.js --clean-linux
      - name: Embed AppImage update information
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find artifacts -maxdepth 1 -type f -name 'CodePet-*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          (
            cd "$workdir"
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )

          curl -fsSL --retry 3 \
            -o "$workdir/appimagetool-x86_64.AppImage" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool-x86_64.AppImage' \
            | (cd "$workdir" && sha256sum -c -)
          chmod +x "$workdir/appimagetool-x86_64.AppImage"
          rm -f "$appimage" "$appimage.zsync"
          APPIMAGE_EXTRACT_AND_RUN=1 "$workdir/appimagetool-x86_64.AppImage" \
            -u 'gh-releases-zsync|nokryong|CodePet|latest|CodePet-*-x86_64.AppImage.zsync' \
            "$workdir/squashfs-root" "$appimage"

          expected_zsync="$appimage.zsync"
          generated_zsync="$(find . -maxdepth 2 -type f -name "$(basename "$appimage").zsync" -print -quit)"
          test -n "$generated_zsync"
          if [ "$generated_zsync" != "$expected_zsync" ]; then
            mv "$generated_zsync" "$expected_zsync"
          fi
          test -s "$appimage"
          test -s "$expected_zsync"
          update_info="$("$appimage" --appimage-updateinformation)"
          printf 'AppImage update information: %s\n' "$update_info"
          test "$update_info" = 'gh-releases-zsync|nokryong|CodePet|latest|CodePet-*-x86_64.AppImage.zsync'
      - name: Preserve the native package
        uses: actions/upload-artifact@v4
        with:
          name: CodePet-native-${{ runner.os }}-${{ github.sha }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload the native package to a draft GitHub Release
        if: needs.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --generate-notes || true
          fi
          for attempt in 1 2 3 4 5; do
            gh release view "$RELEASE_TAG" >/dev/null 2>&1 && break
            sleep 2
          done
          git fetch --tags origin
          node scripts/release-identity.js
          gh release upload "$RELEASE_TAG" ${{ matrix.file }} --clobber

  collect:
    needs: [metadata, build]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download all three native packages
        uses: actions/download-artifact@v4
        with:
          pattern: CodePet-native-*
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: artifacts
        shell: bash
        run: sha256sum CodePet-*.exe CodePet-*.AppImage CodePet-*.AppImage.zsync CodePet-*.dmg > SHA256SUMS
      - name: Publish the complete three-platform GitHub Release
        if: needs.metadata.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/release-notes.js > release-notes.md
          git fetch --tags origin
          node scripts/release-identity.js
          gh release upload "$RELEASE_TAG" artifacts/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md --draft=false
          git fetch --tags origin
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
